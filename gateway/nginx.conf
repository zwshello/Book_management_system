server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /gateway/health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/v1/auth {
        set $upstream user-service:8001;
        proxy_pass http://$upstream$request_uri;
    }
    location ^~ /api/v1/users {
        set $upstream user-service:8001;
        proxy_pass http://$upstream$request_uri;
    }
    location ^~ /api/v1/books {
        set $upstream book-service:8002;
        proxy_pass http://$upstream$request_uri;
    }
    location ^~ /api/v1/categories {
        set $upstream book-service:8002;
        proxy_pass http://$upstream$request_uri;
    }
    location ^~ /api/v1/borrows {
        set $upstream borrow-service:8003;
        proxy_pass http://$upstream$request_uri;
    }
    location ^~ /api/v1/statistics {
        set $upstream statistics-service:8004;
        proxy_pass http://$upstream$request_uri;
    }
    location / {
        set $upstream frontend:80;
        proxy_pass http://$upstream$request_uri;
    }
}
